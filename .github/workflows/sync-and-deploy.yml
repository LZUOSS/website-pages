name: Sync events and publish website
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-publish
  cancel-in-progress: false
jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_second.outputs.page_url || steps.deploy_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Sync event data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync-events.py
      - name: Commit data
        run: |
          git add data/events.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update competition and conference data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # Retry deployment only; never re-upload the Pages artifact in the same run.
      - name: Publish website (attempt 1)
        id: deploy_first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before second attempt
        if: ${{ !cancelled() && steps.deploy_first.outcome == 'failure' }}
        run: sleep 20
      - name: Publish website (attempt 2)
        id: deploy_second
        if: ${{ !cancelled() && steps.deploy_first.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final attempt
        if: ${{ !cancelled() && steps.deploy_second.outcome == 'failure' }}
        run: sleep 40
      - name: Publish website (attempt 3)
        id: deploy_final
        if: ${{ !cancelled() && steps.deploy_second.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
